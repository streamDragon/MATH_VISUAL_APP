<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מעבדת חקירה - מתמטיקה</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <header class="top-bar">
        <div class="controls-row">
            <button class="icon-btn" id="soundBtn" onclick="toggleSound()">🔊</button>
            <div class="select-wrapper">
                <select id="qSelect" onchange="loadQuestionFromSelect()"></select>
            </div>
            <button class="next-btn" onclick="nextQuestion()">הבא &larr;</button>
        </div>
        
        <div class="question-card" id="qCard">
            <div class="q-icon">🎯</div>
            <div class="q-content">
                <h3 id="qTitle">כותרת שאלה</h3>
                <p id="qDesc">תיאור השאלה יופיע כאן בצורה ברורה.</p>
            </div>
        </div>
    </header>

    <main class="canvas-wrapper" id="cWrap">
        <div class="equation-float" id="eqn">y = x²</div>
        <canvas id="cvs"></canvas>
        
        <div class="hud">
            <div><span>X</span><b id="hX">0</b></div>
            <div><span>Y</span><b id="hY">0</b></div>
            <div><span>m</span><b id="hM">0</b></div>
        </div>

        <div class="zoom-controls">
            <button onclick="changeZoom(1.2)">+</button>
            <button onclick="changeZoom(0.8)">-</button>
        </div>

        <div id="prox" class="feedback-bar">חם... 🔥</div>
        <div id="win" class="win-modal">
            <div class="win-content">
                <h1>✨ כל הכבוד! ✨</h1>
                <p>פיצחת את האתגר.</p>
                <button onclick="nextQuestion()">לשאלה הבאה</button>
            </div>
        </div>
    </main>

    <footer class="bottom-controls">
        <input type="range" id="mainX" min="-10" max="10" step="0.01" oninput="updateFromSlider()">
        
        <details>
            <summary>⚙️ עריכה מתקדמת (פרמטרים)</summary>
            <div class="manual-grid">
                <label>x³ <input type="number" id="mA" step="0.1" value="0" oninput="manual()"></label>
                <label>x² <input type="number" id="mB" step="0.1" value="1" oninput="manual()"></label>
                <label>x¹ <input type="number" id="mC" step="0.1" value="0" oninput="manual()"></label>
                <label>Num <input type="number" id="mD" step="0.1" value="0" oninput="manual()"></label>
            </div>
        </details>
    </footer>
</div>

<script src="script.js"></script>
</body>
</html>
