<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>חקר פונקציות מתקדם</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    
    <header>
        <select id="qSelect" onchange="loadQuestionFromSelect()"></select>
        <button class="btn-nav" onclick="nextQuestion()">הבא &larr;</button>
    </header>

    <main id="mainArea">
        <div class="overlay-info">
            <div class="eq-text" id="eqn">y = ...</div>
            <div class="instr-text">
                <span id="qIcon">🎯</span> <span id="qText">טוען...</span>
            </div>
        </div>

        <div id="successBanner" class="success-badge">✨ בול בפוני! ✨</div>

        <canvas id="cvs"></canvas>

        <div class="zoom-bar">
            <button onclick="changeZoom(1.1)">+</button>
            <button onclick="changeZoom(0.9)">-</button>
            <button onclick="resetView()">⟲</button>
        </div>
    </main>

    <footer>
        <div class="slider-container">
            <span class="lbl">X</span>
            <input type="range" id="mainX" min="-10" max="10" step="0.01" oninput="updateFromSlider()">
        </div>
        
        <div class="manual-edit-row">
            <span class="edit-icon">✎</span>
            <input type="number" id="mA" placeholder="a" oninput="manual()">
            <input type="number" id="mB" placeholder="b" oninput="manual()">
            <input type="number" id="mC" placeholder="c" oninput="manual()">
            <input type="number" id="mD" placeholder="d" oninput="manual()">
        </div>
    </footer>

</div>
<script src="bagrut_questions.js"></script> 
<script src="script.js"></script>
</body>
</html>
