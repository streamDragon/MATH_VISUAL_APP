<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Visual App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app-container">
    
    <main id="graph-panel">
        <canvas id="cvs"></canvas>
        
        <div id="hud-top-left">
            <div id="eqn"></div>
            <div id="derivEqn"></div>
        </div>

        <div id="successToast">כל הכבוד! ✅</div>

        <div id="proximityWrapper">
            <div id="hotColdText">קר...</div>
            <div id="proximityBarContainer"><div id="proximityBar"></div></div>
        </div>
        
        <div id="holyTrinity">
            <div class="triItem"><span id="valX"></span></div>
            <div class="triItem"><span id="valY"></span></div>
            <div class="triItem"><span id="valM"></span></div>
            <div class="triItem" id="lineEqn" style="font-size:0.85em; margin-top:3px; border-top:1px solid #ddd; padding-top:2px;"></div>
        </div>
    </main>

    <aside id="side-panel">
        
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 id="qCounter" style="margin:0; color:#2563eb;">שאלה 1</h3>
                <button id="btnSound" onclick="toggleMute()" class="icon-btn">🔊</button>
            </div>
            <p id="qText" style="margin-top:10px; font-weight:600;"></p>
            <select id="qSelect" onchange="loadQuestionFromSelect()" style="width:100%; margin-top:5px; padding:5px;"></select>
        </div>

        <div id="sliderXContainer" class="card control-box">
            <label>הזז את ה-X: <span id="valX_slider" style="float:left; color:#2563eb;">0</span></label>
            <input type="range" id="mainX" min="-10" max="10" step="0.1" oninput="updateFromSlider()">
        </div>

        <div class="card control-box">
            <h4>פרמטרים (משנים את הפונקציה)</h4>
            
            <div class="slider-row">
                <label>a (x³): <span id="valA"></span></label>
                <input type="range" id="mA" min="-5" max="5" step="0.1" oninput="manual()">
            </div>
            <div class="slider-row">
                <label>b (x²): <span id="valB"></span></label>
                <input type="range" id="mB" min="-5" max="5" step="0.1" oninput="manual()">
            </div>
            <div class="slider-row">
                <label>c (x): <span id="valC"></span></label>
                <input type="range" id="mC" min="-10" max="10" step="0.1" oninput="manual()">
            </div>
            <div class="slider-row">
                <label>d (מספר): <span id="valD"></span></label>
                <input type="range" id="mD" min="-10" max="10" step="0.1" oninput="manual()">
            </div>
        </div>

        <div class="card" style="flex:1; display:flex; flex-direction:column; min-height:100px;">
            <h4>יומן משוואות</h4>
            <div id="journalList"></div>
        </div>

        <div style="display:flex; gap:10px; margin-top:10px;">
             <button class="btn" onclick="zoomIn()">➕ זום</button>
             <button class="btn" onclick="zoomOut()">➖ זום</button>
             <button class="btn" onclick="resetZoom()">איפוס</button>
             <button class="btn primary" onclick="nextQuestion()" style="margin-right:auto;">הבא &larr;</button>
        </div>

    </aside>

</div>

<script src="bagrut_questions.js"></script>
<script src="script.js"></script>
</body>
</html>
