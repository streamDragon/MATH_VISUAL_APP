<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעבדה לחקירת פונקציות</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&family=Computer+Modern+Serif&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    <header class="main-header">
        <div class="math-display">
            <div class="func-line">f(x) = <span id="funcEqn" dir="ltr">...</span></div>
            <div class="deriv-line">f'(x) = <span id="derivEqn" dir="ltr">...</span></div>
        </div>
        
        <div class="trinity-panel">
            <div class="trinity-item">
                <span class="label">X</span>
                <span id="dispX" class="value">0</span>
            </div>
            <div class="trinity-item">
                <span class="label">Y (גובה)</span>
                <span id="dispY" class="value">0</span>
            </div>
            <div class="trinity-item slope-highlight">
                <span class="label">M (שיפוע)</span>
                <span id="dispM" class="value">0</span>
            </div>
        </div>
    </header>

    <div class="workspace">
        <div class="main-content">
            <div class="question-box">
                <div class="question-nav">
                    <button id="btnPrev" class="nav-btn">⬅️ הקודם</button>
                    <select id="selectQuestion" class="nav-select"></select>
                    <button id="btnNext" class="nav-btn">הבא ➡️</button>
                </div>
                <h2 id="questionTitle">טוען שאלה...</h2>
                <div id="questionText">אנא המתן לטעינת הנתונים...</div>
                <div id="successMessage"></div>
            </div>
            
            <div id="canvasContainer">
                <canvas id="graphCanvas"></canvas>
            </div>
        </div>

        <div class="sidebar">
            <div class="panel controls">
                <h3>🎛️ פרמטרים של הפונקציה</h3>
                <div class="control-group">
                    <label>a: <span id="valA">0</span></label>
                    <input type="range" id="paramA" min="-2" max="2" step="0.1">
                </div>
                <div class="control-group">
                    <label>b: <span id="valB">0</span></label>
                    <input type="range" id="paramB" min="-3" max="3" step="0.1">
                </div>
                <div class="control-group">
                    <label>c: <span id="valC">0</span></label>
                    <input type="range" id="paramC" min="-5" max="5" step="0.1">
                </div>
                <div class="control-group">
                    <label>d: <span id="valD">0</span></label>
                    <input type="range" id="paramD" min="-5" max="5" step="0.1">
                </div>
            </div>

            <div class="panel x-control">
                <h3>📍 חקירת נקודה</h3>
                <div class="control-group">
                    <label>מיקום ה-X: <span id="valX">0</span></label>
                    <input type="range" id="paramX" min="-6" max="6" step="0.1">
                </div>
                <div class="tangent-eqn-box" dir="ltr">
                    <strong>Tangent Equation:</strong>
                    <div id="tangentEqn">y - y₁ = m(x - x₁)</div>
                </div>
            </div>

            <div class="panel journal">
                <h3>📜 יומן הצלחות</h3>
                <ul id="journalList"></ul>
            </div>
        </div>
    </div>
</div>

<script src="bagrut_questions.js"></script>
<script src="script.js"></script>

</body>
</html>
