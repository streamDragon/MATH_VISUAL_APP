<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מעבדת הפונקציות</title>
    
    <script type="text/javascript" charset="UTF-8" src="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraph.css" />
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <link rel="stylesheet" href="mobile.css">
</head>
<body>

    <button id="sound-toggle" onclick="toggleSound()">🔊</button>

    <div id="graph-area"></div>

    <div id="hud-container">
        <div id="holy-trinity">
            <div class="trinity-item"><span id="val-x" class="trinity-val">0</span><span class="trinity-label">X</span></div>
            <div class="trinity-item"><span id="val-y" class="trinity-val">0</span><span class="trinity-label">f(x)</span></div>
            <div class="trinity-item"><span id="val-m" class="trinity-val">0</span><span class="trinity-label">f'(x)</span></div>
        </div>
        <div id="tangent-eq">y = mx + n</div>
    </div>

    <div id="win-overlay">
        <h1>🏆 כל הכבוד!</h1>
        <p>הצלחת את המשימה</p>
    </div>

    <div id="sidebar">
        <h2 id="q-title" style="margin:0; text-align:center; font-size:1.5rem;">טוען...</h2>
        
        <div id="q-short-inst"></div>
        
        <button class="theory-btn" onclick="openTheoryModal()">💡 נוסחאות והסברים</button>

        <div class="nav-container" id="questions-nav" style="display:flex; gap:5px; flex-wrap:wrap; margin-bottom:15px; justify-content:center;"></div>

        <div style="background:#f8f9fa; padding:10px; border-radius:10px;">
            <div style="display:flex; margin-bottom:10px; align-items:center;">
                <span style="width:25px; font-weight:bold;">a</span>
                <input type="range" id="inpA" min="-2" max="2" step="0.1" style="flex:1;">
            </div>
            <div style="display:flex; margin-bottom:10px; align-items:center;">
                <span style="width:25px; font-weight:bold;">b</span>
                <input type="range" id="inpB" min="-3" max="3" step="0.1" style="flex:1;">
            </div>
            <div style="display:flex; margin-bottom:10px; align-items:center;">
                <span style="width:25px; font-weight:bold;">c</span>
                <input type="range" id="inpC" min="-5" max="5" step="0.1" style="flex:1;">
            </div>
            <div style="display:flex; margin-bottom:10px; align-items:center;">
                <span style="width:25px; font-weight:bold;">d</span>
                <input type="range" id="inpD" min="-5" max="5" step="0.1" style="flex:1;">
            </div>
        </div>
    </div>

    <div id="theory-modal" class="theory-overlay">
        <button class="close-theory" onclick="closeTheoryModal()">✖ סגור</button>
        <div class="theory-content" id="theory-body"></div>
    </div>

    <script src="sounds.js"></script>
    <script src="questions.js"></script>

    <script>
        let board, p, tangent, curve;
        let targets = [];
        let params = { a:0, b:0, c:0, d:0 };
        let currentQ = 0;
        let isWinning = false;
        let soundEnabled = true; // משתנה לשליטה בסאונד

        function init() {
            if (typeof QUESTIONS === 'undefined') {
                alert("שגיאה: הקובץ questions.js לא נמצא.");
                return;
            }

            board = JXG.JSXGraph.initBoard('graph-area', {
                boundingbox: [-5, 8, 5, -8], axis: true, showCopyright: false,
                pan: { enabled: false }, zoom: { enabled: true }
            });

            curve = board.create('functiongraph', [
                function(x) { return params.a*Math.pow(x,3) + params.b*Math.pow(x,2) + params.c*x + params.d; }
            ], { strokeWidth: 3, strokeColor: '#007bff' });

            p = board.create('glider', [0, 0, curve], { name: '', size: 9, color: '#007bff' });
            tangent = board.create('tangent', [p], { strokeColor: '#ff9f43', strokeWidth: 2, dash:2 });

            // אירועים
            p.on('drag', () => { playSoundWrapper('drag'); updateAll(); });
            board.on('down', () => playSoundWrapper('drag')); 
            board.on('up', updateAll);
            
            ['inpA','inpB','inpC','inpD'].forEach(id => {
                document.getElementById(id).addEventListener('input', () => { updateParams(); });
            });

            // בניית כפתורי ניווט
            const nav = document.getElementById('questions-nav');
            QUESTIONS.forEach((q, i) => {
                let btn = document.createElement('button');
                btn.className = 'q-btn'; 
                btn.innerText = i + 1;
                btn.onclick = () => loadQuestion(i);
                nav.appendChild(btn);
            });

            loadQuestion(0);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('sound-toggle');
            btn.innerText = soundEnabled ? "🔊" : "🔇";
            btn.style.opacity = soundEnabled ? "1" : "0.5";
        }

        function playSoundWrapper(type) {
            // אם סאונד כבוי, לא עושים כלום
            if (!soundEnabled) return;
            // ניסיון לנגן רק אם הפונקציה קיימת
            if(typeof playSound === 'function') {
                // ל'drag' לא תמיד יש צליל, אבל נשאיר את הקריאה
                if(type !== 'drag') playSound(type); 
                else initAudioWrapper(); // רק מוודא שהאודיו אותחל
            }
        }
        function initAudioWrapper() {
            if(soundEnabled && typeof initAudio === 'function') initAudio();
        }

        function updateParams() {
            params.a = parseFloat(document.getElementById('inpA').value);
            params.b = parseFloat(document.getElementById('inpB').value);
            params.c = parseFloat(document.getElementById('inpC').value);
            params.d = parseFloat(document.getElementById('inpD').value);
            board.update();
            updateAll();
        }

        function updateAll() {
            let x = p.X();
            let y = params.a*Math.pow(x,3) + params.b*Math.pow(x,2) + params.c*x + params.d;
            let m = 3*params.a*x*x + 2*params.b*x + params.c; // נגזרת

            // עדכון השלשה הקדושה
            document.getElementById('val-x').innerText = x.toFixed(2);
            document.getElementById('val-y').innerText = y.toFixed(2);
            document.getElementById('val-m').innerText = m.toFixed(2);
            
            // עדכון משוואת המשיק: y = mx + n
            // n = y - mx
            let n = y - (m * x);
            let nStr = n >= 0 ? `+ ${n.toFixed(2)}` : `- ${Math.abs(n).toFixed(2)}`;
            let tangentStr = `y = ${m.toFixed(2)}x ${nStr}`;
            
            let eqEl = document.getElementById('tangent-eq');
            eqEl.innerText = tangentStr;
            eqEl.classList.add('show');

            checkWin(m, x, y);
        }

        function loadQuestion(idx) {
            currentQ = idx;
            isWinning = false;
            let q = QUESTIONS[idx];
            
            // סימון כפתור פעיל
            document.querySelectorAll('.q-btn').forEach((b, i) => {
                b.classList.toggle('active', i === idx);
            });

            document.getElementById('win-overlay').classList.remove('show');
            document.getElementById('holy-trinity').className = ''; 
            document.getElementById('q-title').innerText = q.title;
            document.getElementById('q-short-inst').innerText = q.shortInst || q.desc;
            
            params.a = q.params[0]; params.b = q.params[1]; 
            params.c = q.params[2]; params.d = q.params[3];
            document.getElementById('inpA').value = params.a;
            document.getElementById('inpB').value = params.b;
            document.getElementById('inpC').value = params.c;
            document.getElementById('inpD').value = params.d;
            
            ['inpA','inpB','inpC','inpD'].forEach(id => document.getElementById(id).disabled = false);
            if(q.locked) q.locked.forEach(id => document.getElementById(id).disabled = true);

            board.removeObject(targets);
            targets = [];
            if(q.targets) {
                q.targets.forEach(t => {
                    let pt = board.create('point', [t.x, t.y], { 
                        name:'', fixed:true, color:'#00e676', size:6, face:'o', strokeWidth:2, strokeColor:'black' 
                    });
                    targets.push(pt);
                });
            }

            p.setCoords(0, params.d);
            updateParams();
            playSoundWrapper('pop');
        }

        function checkWin(m, x, y) {
            let q = QUESTIONS[currentQ];
            let win = false;
            let hot = false;

            if (q.goal === 'slope_zero') {
                if (Math.abs(m) < 0.1) win = true;
                else if (Math.abs(m) < 0.6) hot = true;
            }
            if (q.goal === 'slope_equals') {
                if (Math.abs(m - q.targetM) < 0.1) win = true;
                else if (Math.abs(m - q.targetM) < 0.6) hot = true;
            }
            if (q.goal === 'hit_target') {
                let hitCount = 0;
                q.targets.forEach(t => {
                    let yCalc = params.a*Math.pow(t.x,3) + params.b*Math.pow(t.x,2) + params.c*t.x + params.d;
                    let diff = Math.abs(yCalc - t.y);
                    if(diff < 0.3) hitCount++;
                    if(diff < 1.5) hot = true;
                });
                if(hitCount === q.targets.length) win = true;
            }

            const hud = document.getElementById('holy-trinity');
            
            // איפוס מחלקות קודם
            hud.classList.remove('winning', 'hot');

            if (win) {
                hud.classList.add('winning');
                if (!isWinning) {
                    playSoundWrapper('win');
                    document.getElementById('win-overlay').classList.add('show');
                    isWinning = true;
                    setTimeout(() => document.getElementById('win-overlay').classList.remove('show'), 2500);
                }
            } else {
                isWinning = false;
                if(hot) hud.classList.add('hot');
            }
        }

        function openTheoryModal() {
            document.getElementById('theory-body').innerHTML = QUESTIONS[currentQ].theory;
            document.getElementById('theory-modal').style.display = 'flex';
            if(window.MathJax) MathJax.typesetPromise();
        }
        function closeTheoryModal() {
            document.getElementById('theory-modal').style.display = 'none';
        }

        window.onload = init;
    </script>
</body>
</html>
