<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MATH_VISUAL_APP</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 16px; }
    .wrap { max-width: 900px; margin: 0 auto; }
    canvas { width: 100%; height: 420px; border: 1px solid #ddd; border-radius: 8px; }
    .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 14px; }
    .card { border: 1px solid #eee; border-radius: 8px; padding: 10px; }
    label { display:block; font-size: 14px; margin-bottom: 6px; }
    input[type="range"] { width: 100%; }
    .eq { font-size: 18px; margin: 8px 0 12px; }
    .small { font-size: 12px; opacity: .75; }
  </style>
</head>
<body>
<div class="wrap">
  <h2>ויזואליזציה: פרבולה y = ax² + bx + c</h2>
  <div class="eq" id="eq"></div>
  <canvas id="cv" width="900" height="420"></canvas>

  <div class="row">
    <div class="card">
      <label>a: <span id="aVal"></span></label>
      <input id="a" type="range" min="-5" max="5" step="0.1" value="1">
      <div class="small">משפיע על "פתיחות" וכיוון</div>
    </div>
    <div class="card">
      <label>b: <span id="bVal"></span></label>
      <input id="b" type="range" min="-10" max="10" step="0.1" value="-4">
      <div class="small">משפיע על מיקום הקודקוד בציר x</div>
    </div>
    <div class="card">
      <label>c: <span id="cVal"></span></label>
      <input id="c" type="range" min="-20" max="20" step="0.1" value="4">
      <div class="small">חיתוך עם ציר y</div>
    </div>
  </div>
</div>

<script>
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  const aEl = document.getElementById('a');
  const bEl = document.getElementById('b');
  const cEl = document.getElementById('c');

  const aVal = document.getElementById('aVal');
  const bVal = document.getElementById('bVal');
  const cVal = document.getElementById('cVal');
  const eq = document.getElementById('eq');

  // world coords
  let xMin=-10, xMax=10, yMin=-10, yMax=10;

  function f(x,a,b,c){ return a*x*x + b*x + c; }

  function w2s(x,y){
    const sx = (x - xMin) / (xMax - xMin) * cv.width;
    const sy = cv.height - (y - yMin) / (yMax - yMin) * cv.height;
    return [sx, sy];
  }

  function drawAxes(){
    ctx.clearRect(0,0,cv.width,cv.height);

    // grid
    ctx.globalAlpha = 0.25;
    for(let i=Math.ceil(xMin); i<=xMax; i++){
      const [sx] = w2s(i,0);
      ctx.beginPath(); ctx.moveTo(sx,0); ctx.lineTo(sx,cv.height); ctx.stroke();
    }
    for(let j=Math.ceil(yMin); j<=yMax; j++){
      const [,sy] = w2s(0,j);
      ctx.beginPath(); ctx.moveTo(0,sy); ctx.lineTo(cv.width,sy); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // axes
    ctx.lineWidth = 2;
    ctx.beginPath();
    const [x0,y0]=w2s(0,0);
    ctx.moveTo(0,y0); ctx.lineTo(cv.width,y0); // x-axis
    ctx.moveTo(x0,0); ctx.lineTo(x0,cv.height); // y-axis
    ctx.stroke();
    ctx.lineWidth = 1;
  }

  function drawParabola(a,b,c){
    // auto y-range based on sampling
    let ys=[];
    for(let x=xMin; x<=xMax; x+=0.2){ ys.push(f(x,a,b,c)); }
    const lo = Math.min(...ys), hi = Math.max(...ys);
    const pad = Math.max(2, (hi-lo)*0.15);
    yMin = Math.floor(lo - pad);
    yMax = Math.ceil(hi + pad);

    drawAxes();

    // curve
    ctx.beginPath();
    let first=true;
    for(let x=xMin; x<=xMax; x+=0.05){
      const y=f(x,a,b,c);
      const [sx,sy]=w2s(x,y);
      if(first){ ctx.moveTo(sx,sy); first=false; }
      else ctx.lineTo(sx,sy);
    }
    ctx.lineWidth=3;
    ctx.stroke();
    ctx.lineWidth=1;

    // vertex
    if(a !== 0){
      const xv = -b/(2*a);
      const yv = f(xv,a,b,c);
      const [sx,sy]=w2s(xv,yv);
      ctx.beginPath(); ctx.arc(sx,sy,6,0,Math.PI*2); ctx.fill();
    }
  }

  function fmt(n){ return (Math.round(n*10)/10).toFixed(1); }

  function render(){
    const a=Number(aEl.value), b=Number(bEl.value), c=Number(cEl.value);
    aVal.textContent = fmt(a);
    bVal.textContent = fmt(b);
    cVal.textContent = fmt(c);

    const signB = b>=0 ? "+" : "−";
    const signC = c>=0 ? "+" : "−";
    eq.textContent = `y = ${fmt(a)}x² ${signB} ${fmt(Math.abs(b))}x ${signC} ${fmt(Math.abs(c))}`;

    drawParabola(a,b,c);
  }

  [aEl,bEl,cEl].forEach(el => el.addEventListener('input', render));
  render();
</script>
</body>
</html>
