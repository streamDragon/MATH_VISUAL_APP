<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מעבדת חקירה</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-layout">
    
    <header class="header-section">
        <div class="top-controls">
            <button class="btn-icon" onclick="toggleSound()" id="soundBtn">🔊</button>
            <select id="qSelect" onchange="loadQuestionFromSelect()"></select>
            <button class="btn-next" onclick="nextQuestion()">הבא &larr;</button>
        </div>

        <div class="instruction-card">
            <div class="card-icon">💡</div>
            <div class="card-text">
                <h3 id="qTitle">טוען שאלה...</h3>
                <p id="qDesc">תיאור המשימה יופיע כאן</p>
            </div>
        </div>
    </header>

    <main class="canvas-container" id="cWrap">
        <div class="equation-overlay" id="eqn">y = ...</div>
        
        <canvas id="cvs"></canvas>

        <div class="hud-panel">
            <div>X: <b id="hX">0</b></div>
            <div>Y: <b id="hY">0</b></div>
            <div>m: <b id="hM">0</b></div>
        </div>

        <div class="zoom-fab">
            <button onclick="changeZoom(1.1)">+</button>
            <button onclick="changeZoom(0.9)">-</button>
        </div>

        <div id="prox" class="feedback-toast"></div>
        
        <div id="win" class="win-overlay">
            <div class="win-box">
                <h1>🎉 הצלחת!</h1>
                <button onclick="nextQuestion()">לשאלה הבאה</button>
            </div>
        </div>
    </main>

    <footer class="footer-section">
        <div class="slider-area">
            <label>הזיזו את X:</label>
            <input type="range" id="mainX" min="-10" max="10" step="0.01" oninput="updateFromSlider()">
        </div>
        
        <details>
            <summary>⚙️ עריכה ידנית</summary>
            <div class="manual-inputs">
                <input type="number" id="mA" placeholder="x³" oninput="manual()">
                <input type="number" id="mB" placeholder="x²" oninput="manual()">
                <input type="number" id="mC" placeholder="x" oninput="manual()">
                <input type="number" id="mD" placeholder="Num" oninput="manual()">
            </div>
        </details>
    </footer>

</div>

<script src="script.js"></script>
</body>
</html>
