<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מערכת חקר פונקציות</title>
    <style>
        /* === עיצוב (STYLE) === */
        :root { --primary:#2563eb; --success:#22c55e; --purple:#9333ea; --orange:#f97316; --bg:#f8fafc; --panel-bg:#ffffff; --border:#cbd5e1; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin:0; padding:0; font-family:'Segoe UI',sans-serif; background:var(--bg); height:100vh; width:100vw; display:flex; flex-direction:row; overflow:hidden; user-select:none; }
        #graph-container { flex:1; position:relative; background:white; cursor:crosshair; height:100%; touch-action:none; }
        canvas { display:block; width:100%; height:100%; }
        #sidebar { width:380px; background:var(--panel-bg); border-right:1px solid var(--border); display:flex; flex-direction:column; height:100%; box-shadow:-2px 0 10px rgba(0,0,0,0.05); z-index:10; }
        .sidebar-header { padding:15px; background:#f1f5f9; border-bottom:1px solid var(--border); flex-shrink:0; }
        select { width:100%; padding:10px; font-size:1rem; border:1px solid #94a3b8; border-radius:6px; background:white; cursor:pointer; margin-top:5px; }
        #success-area { display:none; margin-top:10px; background:#dcfce7; padding:10px; border-radius:6px; border:1px solid var(--success); animation:slideDown 0.3s ease-out; }
        .success-msg { text-align:center; margin-bottom:5px; font-weight:bold; color:#14532d; }
        #btn-next { background:var(--success); color:white; border:none; padding:10px; font-size:1rem; font-weight:bold; border-radius:6px; cursor:pointer; width:100%; display:flex; justify-content:center; align-items:center; gap:10px; }
        #btn-next:hover { background:#16a34a; }
        @keyframes slideDown { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:translateY(0); } }
        .scroll-content { flex:1; overflow-y:auto; padding:15px; }
        .card { background:white; border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:15px; }
        .card h3 { margin:0 0 8px 0; font-size:1.1rem; color:#1e293b; border-bottom:1px solid #eee; padding-bottom:5px; }
        .card p { margin:0; font-size:0.95rem; color:#475569; line-height:1.5; white-space:pre-line; }
        .tip-box { font-size:0.85rem; color:#64748b; margin-bottom:10px; text-align:center; background:#f1f5f9; padding:5px; border-radius:4px; }
        .point-card { background:#fff7ed; border-color:#fdba74; } .point-card h3 { color:var(--orange); }
        .params-legend { display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:0.8rem; color:#64748b; margin-bottom:10px; background:#f8fafc; padding:8px; border-radius:6px; }
        .control-row { display:flex; align-items:center; margin-bottom:12px; }
        .control-row label { font-weight:bold; width:25px; font-family:monospace; font-size:1.1rem; }
        input[type=range] { flex:1; margin:0 10px; height:30px; cursor:pointer; }
        .val-disp { width:45px; text-align:left; font-family:monospace; font-weight:bold; color:var(--primary); font-size:0.9rem; }
        .toggle-btn { width:100%; padding:12px; background:white; border:2px solid var(--purple); color:var(--purple); border-radius:8px; font-weight:bold; cursor:pointer; margin-bottom:15px; transition:all 0.2s; }
        .toggle-btn.active { background:var(--purple); color:white; }
        #normalControls { border-color:var(--purple); } #normalControls h3 { color:var(--purple); }
        .slope-prod-box { font-size:0.95rem; margin-bottom:10px; background:#f3e8ff; padding:8px; border-radius:4px; border:1px solid #d8b4fe; text-align:center; }
        #slopeProd { font-weight:bold; font-family:monospace; font-size:1.1rem; direction:ltr; }
        @media (max-width: 768px) { body { flex-direction:column; } #graph-container { height:45vh; border-bottom:2px solid #cbd5e1; } #sidebar { width:100%; height:55vh; border-right:none; } }
    </style>
</head>
<body>

    <div id="graph-container">
        <canvas id="cvs"></canvas>
    </div>

    <div id="sidebar">
        <div class="sidebar-header">
            <label>בחר משימה:</label>
            <select id="questionsMenu"></select>
            <div id="success-area">
                <div class="success-msg">🎉 כל הכבוד! הצלחת!</div>
                <button id="btn-next" onclick="nextQuestion()">עבור לשאלה הבאה &larr;</button>
            </div>
        </div>

        <div class="scroll-content">
            <div class="card" style="border-right: 4px solid #2563eb;">
                <h3 id="qTitle">...</h3>
                <p id="qDesc">...</p>
            </div>

            <div class="tip-box">
                💡 <b>גרירה:</b> הזיזו את הנקודה הכחולה לשינוי X,<br>או את הרקע לשינוי הגובה (d).
            </div>

            <div class="card point-card">
                <h3>📍 שליטה בנקודה</h3>
                <div class="control-row">
                    <label>X</label>
                    <input type="range" id="inpX" min="-5" max="5" step="0.1">
                    <span class="val-disp" id="valX">0</span>
                </div>
            </div>

            <button class="toggle-btn" id="btnNormalToggle">📐 מעבדת האנך (לחץ לפתיחה)</button>
            <div class="card" id="normalControls" style="display:none;">
                <h3>כיוון האנך</h3>
                <div class="slope-prod-box">
                    מכפלת שיפועים $(m \cdot m_2)$:<br>
                    <span id="slopeProd"></span>
                </div>
                <div class="control-row">
                    <label>m2</label>
                    <input type="range" id="inpNormalSlope" min="-10" max="10" step="0.1" value="1">
                    <span class="val-disp" id="valNormal">1</span>
                </div>
            </div>

            <div class="card">
                <h3>🛠 בניית הפונקציה</h3>
                <div class="params-legend">
                    <div><b>a</b>: עקמומיות</div>
                    <div><b>b</b>: הזזה אופקית</div>
                    <div><b>c</b>: שיפוע בחיתוך</div>
                    <div><b>d</b>: גובה</div>
                </div>
                <div class="control-row"><label>a</label><input type="range" id="inpA" min="-2" max="2" step="0.1"><span class="val-disp" id="valA">0</span></div>
                <div class="control-row"><label>b</label><input type="range" id="inpB" min="-3" max="3" step="0.1"><span class="val-disp" id="valB">0</span></div>
                <div class="control-row"><label>c</label><input type="range" id="inpC" min="-5" max="5" step="0.1"><span class="val-disp" id="valC">0</span></div>
                <div class="control-row"><label>d</label><input type="range" id="inpD" min="-5" max="5" step="0.1"><span class="val-disp" id="valD">0</span></div>
            </div>
            <div style="height: 50px;"></div>
        </div>
    </div>

    <script src="questions.js"></script>
    <script src="engine.js"></script>

</body>
</html>
