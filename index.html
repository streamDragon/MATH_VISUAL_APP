<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מעבדת הפונקציות</title>
    
    <script type="text/javascript" charset="UTF-8" src="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraph.css" />
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap" rel="stylesheet">
    
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <link rel="stylesheet" href="mobile.css">
</head>
<body>

    <div id="graph-area"></div>

    <div id="holy-trinity">
        <div class="trinity-row">
            <span id="val-x" class="trinity-val">0</span>
            <span class="trinity-label">X</span>
        </div>
        <div class="trinity-row">
            <span id="val-y" class="trinity-val">0</span>
            <span class="trinity-label">f(x)</span>
        </div>
        <div class="trinity-row">
            <span id="val-m" class="trinity-val">0</span>
            <span class="trinity-label">f'(x)</span>
        </div>
    </div>

    <div id="sidebar">
        <h2 id="q-title" style="margin:0; text-align:center;">טוען...</h2>
        <p id="q-desc" style="text-align:center; color:#555;">תיאור קצר</p>
        
        <button class="theory-btn" onclick="openTheoryModal()">
            💡 לחץ להסבר מלא ואינטואיציה
        </button>

        <details>
            <summary>ניווט בין שאלות</summary>
            <div class="nav-container" id="questions-nav"></div>
        </details>

        <details open>
            <summary>בניית הפונקציה</summary>
            <div style="padding:15px;">
                <div style="display:flex; margin-bottom:10px;">
                    <span style="width:30px; font-weight:bold;">a</span>
                    <input type="range" id="inpA" min="-2" max="2" step="0.1" style="flex:1;">
                </div>
                <div style="display:flex; margin-bottom:10px;">
                    <span style="width:30px; font-weight:bold;">b</span>
                    <input type="range" id="inpB" min="-3" max="3" step="0.1" style="flex:1;">
                </div>
                <div style="display:flex; margin-bottom:10px;">
                    <span style="width:30px; font-weight:bold;">c</span>
                    <input type="range" id="inpC" min="-5" max="5" step="0.1" style="flex:1;">
                </div>
                <div style="display:flex; margin-bottom:10px;">
                    <span style="width:30px; font-weight:bold;">d</span>
                    <input type="range" id="inpD" min="-5" max="5" step="0.1" style="flex:1;">
                </div>
            </div>
        </details>
    </div>

    <div id="theory-modal" class="theory-overlay">
        <div class="theory-content">
            <button class="close-theory" onclick="closeTheoryModal()">✖ סגור וחזור לתרגיל</button>
            <h1 style="text-align: center; margin-top:40px;">הסבר מעמיק</h1>
            <div id="theory-body">
                </div>
        </div>
    </div>

    <script src="sound.js"></script>
    <script src="questions.js"></script>

    <script>
        let board, p, tangent, normal, curve;
        let params = { a:0, b:0, c:0, d:0 };
        let currentQ = 0;

        function init() {
            board = JXG.JSXGraph.initBoard('graph-area', {
                boundingbox: [-5, 8, 5, -8], axis: true, showCopyright: false,
                pan: { enabled: false }, zoom: { enabled: true }
            });

            // הפונקציה
            curve = board.create('functiongraph', [
                function(x) { return params.a*Math.pow(x,3) + params.b*Math.pow(x,2) + params.c*x + params.d; }
            ], { strokeWidth: 3, strokeColor: '#007bff' });

            // נקודה נגררת
            p = board.create('glider', [0, 0, curve], { name: '', size: 6, color: '#007bff' });
            
            // משיק ונורמל
            tangent = board.create('tangent', [p], { strokeColor: '#ff9f43', strokeWidth: 2, dash:2 });
            normal = board.create('normal', [p], { strokeColor: '#a55eea', strokeWidth: 2, visible: false });

            // אירועים
            p.on('drag', updateAll);
            board.on('up', updateAll);
            ['inpA','inpB','inpC','inpD'].forEach(id => {
                document.getElementById(id).addEventListener('input', updateParams);
            });

            // בניית כפתורי ניווט
            const nav = document.getElementById('questions-nav');
            QUESTIONS.forEach((q, i) => {
                let btn = document.createElement('div');
                btn.className = 'q-btn';
                btn.innerText = i;
                btn.onclick = () => loadQuestion(i);
                if(i===0) btn.classList.add('active');
                nav.appendChild(btn);
            });

            loadQuestion(0);
        }

        function updateParams() {
            params.a = parseFloat(document.getElementById('inpA').value);
            params.b = parseFloat(document.getElementById('inpB').value);
            params.c = parseFloat(document.getElementById('inpC').value);
            params.d = parseFloat(document.getElementById('inpD').value);
            board.update();
            updateAll();
        }

        function updateAll() {
            let x = p.X();
            let y = params.a*x*x*x + params.b*x*x + params.c*x + params.d;
            let m = 3*params.a*x*x + 2*params.b*x + params.c;

            document.getElementById('val-x').innerText = x.toFixed(2);
            document.getElementById('val-y').innerText = y.toFixed(2);
            document.getElementById('val-m').innerText = m.toFixed(2);
            
            checkWin(m, x, y);
        }

        function loadQuestion(idx) {
            currentQ = idx;
            let q = QUESTIONS[idx];
            
            // עדכון טקסטים
            document.getElementById('q-title').innerText = q.title;
            document.getElementById('q-desc').innerText = q.desc;
            
            // עדכון פרמטרים
            params.a = q.params[0]; params.b = q.params[1]; 
            params.c = q.params[2]; params.d = q.params[3];
            document.getElementById('inpA').value = params.a;
            document.getElementById('inpB').value = params.b;
            document.getElementById('inpC').value = params.c;
            document.getElementById('inpD').value = params.d;
            
            // איפוס נקודה
            p.setCoords(0, params.d);
            
            // נראות נורמל
            normal.setAttribute({ visible: q.showNormal || false });
            
            // נעילת סליידרים
            let ids = ['inpA','inpB','inpC','inpD'];
            ids.forEach(id => document.getElementById(id).disabled = false);
            if(q.locked) q.locked.forEach(id => document.getElementById(id).disabled = true);

            // ניקוי מטרות ישנות ויצירת חדשות
            board.removeObject(board.objectsList.filter(o => o.name === 'TARGET'));
            if(q.targets) {
                q.targets.forEach(t => {
                    board.create('point', [t.x, t.y], { name:'TARGET', fixed:true, color:'#2ecc71', size:8, face:'x' });
                });
            }

            // עדכון כפתור פעיל
            document.querySelectorAll('.q-btn').forEach((b, i) => {
                b.classList.toggle('active', i === idx);
            });

            playSound('pop');
            board.update();
            updateAll();
        }

        function checkWin(m, x, y) {
            let q = QUESTIONS[currentQ];
            let win = false;
            
            if (q.goal === 'slope_zero' && Math.abs(m) < 0.1) win = true;
            if (q.goal === 'slope_equals' && Math.abs(m - q.targetM) < 0.1) win = true;
            if (q.goal === 'hit_target') {
                let allHit = true;
                q.targets.forEach(t => {
                    let yCalc = params.a*Math.pow(t.x,3) + params.b*Math.pow(t.x,2) + params.c*t.x + params.d;
                    if(Math.abs(yCalc - t.y) > 0.2) allHit = false;
                });
                if(allHit) win = true;
            }

            // צבע רקע לשלשה הקדושה
            const hud = document.getElementById('holy-trinity');
            if(win) hud.style.background = "rgba(46, 204, 113, 0.5)";
            else hud.style.background = "rgba(255, 255, 255, 0.3)";
        }

        // --- ניהול מסך תיאוריה ---
        function openTheoryModal() {
            let q = QUESTIONS[currentQ];
            let content = q.theory || "<p>אין הסבר מיוחד לשאלה זו.</p>";
            document.getElementById('theory-body').innerHTML = content;
            document.getElementById('theory-modal').style.display = 'block';
            
            // רינדור מחדש של נוסחאות אם צריך
            if(window.MathJax) MathJax.typesetPromise();
        }

        function closeTheoryModal() {
            document.getElementById('theory-modal').style.display = 'none';
        }

        window.onload = init;
    </script>
</body>
</html>
