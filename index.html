<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מערכת חקר פונקציות</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --accent: #16a34a;
            --bg-sidebar: #ffffff;
            --bg-app: #f1f5f9;
        }

        body { margin: 0; padding: 0; font-family: 'Rubik', sans-serif; background: var(--bg-app); height: 100vh; overflow: hidden; display: flex; }

        /* מבנה */
        #app { display: flex; width: 100%; height: 100%; }
        
        /* צד ימין - תפריט */
        aside {
            width: 320px; background: var(--bg-sidebar); border-left: 1px solid #cbd5e1;
            display: flex; flex-direction: column; padding: 15px; gap: 12px;
            overflow-y: auto; z-index: 20; box-shadow: 2px 0 10px rgba(0,0,0,0.05);
        }

        /* צד שמאל - גרף */
        main { flex: 1; position: relative; background: #fff; cursor: crosshair; }
        canvas { display: block; width: 100%; height: 100%; }

        /* כרטיסים בתפריט */
        .card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; }
        .card h3 { margin: 0 0 5px 0; font-size: 1rem; color: #1e293b; }
        .card p { margin: 0; font-size: 0.9rem; color: #475569; line-height: 1.4; white-space: pre-line; }

        /* סליידרים */
        .control-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .control-row label { font-size: 0.9rem; font-weight: 500; width: 80px; }
        input[type=range] { flex: 1; cursor: pointer; accent-color: var(--primary); }
        .val-display { font-family: monospace; width: 40px; text-align: left; margin-right: 8px; color: var(--primary); font-weight: bold; }

        /* דף נוסחאות (מוטמע בגרף) */
        #paper-hud {
            position: absolute; top: 10px; left: 10px; /* צד שמאל באנגלית, ימין בעברית בגלל RTL */
            right: auto; /* מאפסים צד שני */
            background: rgba(255, 255, 255, 0.95);
            padding: 15px; border-radius: 8px;
            border: 1px solid #94a3b8;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            pointer-events: none; /* כדי שאפשר יהיה ללחוץ על הגרף מתחת אם צריך */
            max-width: 250px;
        }
        /* בגלל שהמסך RTL, ה-absolute left ממקם אותו משמאל. אם רוצים בימין (על הגרף): */
        /* תיקון למיקום: */
        #paper-hud { left: unset; right: 20px; top: 20px; text-align: right; }

        .formula-line { font-family: 'Times New Roman', serif; font-size: 1.1rem; margin-bottom: 5px; color: #0f172a; }
        .formula-label { font-size: 0.85rem; color: #64748b; font-weight: bold; margin-bottom: 2px; display: block; font-family: 'Rubik'; }

        /* טולטיפ וכפתורים */
        #tooltip { position: absolute; background: rgba(0,0,0,0.8); color: white; padding: 5px; border-radius: 4px; font-size: 0.8rem; display: none; pointer-events: none; direction: ltr; }
        
        #toast { 
            position: absolute; top: 20px; left: 50%; transform: translate(-50%, -150%);
            background: var(--accent); color: white; padding: 10px 20px; border-radius: 50px;
            transition: 0.3s; z-index: 100; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        #toast.show { transform: translate(-50%, 0); }

        /* התאמה למובייל */
        @media (max-width: 768px) {
            #app { flex-direction: column-reverse; }
            aside { width: 100%; height: 45%; }
            main { height: 55%; }
            #paper-hud { transform: scale(0.8); transform-origin: top right; }
        }
    </style>
</head>
<body>

<div id="toast">🎉 כל הכבוד! הצלחת</div>

<div id="app">
    <aside>
        <h2 style="margin:0 0 10px 0;">מעבדת חקירה</h2>
        
        <div class="card" style="border-left: 4px solid var(--primary);">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3>שאלה נוכחית:</h3>
                <span id="qIndexBadge" style="background:#e2e8f0; padding:2px 6px; border-radius:4px; font-size:0.8rem;">1/5</span>
            </div>
            <select id="qSelect" onchange="gameLoadQuestion(this.value)" style="width:100%; margin: 8px 0; padding: 5px;"></select>
            <p id="qDesc">טוען...</p>
        </div>

        <div class="card">
            <h3>פרמטרים (בנייה)</h3>
            <div class="control-row"><label>a (x³)</label><input type="range" id="inpA" min="-2" max="2" step="0.1" oninput="sysUpdate()"><div class="val-display" id="valA">0</div></div>
            <div class="control-row"><label>b (x²)</label><input type="range" id="inpB" min="-4" max="4" step="0.1" oninput="sysUpdate()"><div class="val-display" id="valB">0</div></div>
            <div class="control-row"><label>c (x)</label><input type="range" id="inpC" min="-5" max="5" step="0.1" oninput="sysUpdate()"><div class="val-display" id="valC">0</div></div>
            <div class="control-row"><label>d (מספר)</label><input type="range" id="inpD" min="-5" max="5" step="0.1" oninput="sysUpdate()"><div class="val-display" id="valD">0</div></div>
        </div>

        <div class="card" style="border-left: 4px solid #f97316;">
            <h3>חקירה (הזזת X)</h3>
            <div class="control-row">
                <input type="range" id="inpX" min="-5" max="5" step="0.1" oninput="sysUpdate()">
                <div class="val-display" id="valX" style="color:#f97316;">0</div>
            </div>
            <div style="font-size:0.85rem; text-align:center; color:#64748b; margin-top:5px;">
                ערך נגזרת (שיפוע): <span id="valSlope" style="font-weight:bold; color:black;">0.00</span>
            </div>
        </div>
        
        <button onclick="gameNext()" style="margin-top:auto; padding:10px; background:var(--primary); color:white; border:none; border-radius:6px; font-size:1rem; cursor:pointer;">השאלה הבאה &larr;</button>
    </aside>

    <main id="graphContainer">
        <canvas id="cvs"></canvas>
        
        <div id="paper-hud">
            <span class="formula-label">הפונקציה:</span>
            <div class="formula-line" id="mathFunc" style="color:var(--primary);">f(x) = ...</div>
            
            <div style="margin-top:10px; border-top:1px dashed #cbd5e1; padding-top:10px;">
                <span class="formula-label">הנגזרת (נוסחה):</span>
                <div class="formula-line" id="mathDerivText">f'(x) = 3ax² + 2bx + c</div>
                
                <span class="formula-label" style="margin-top:8px;">חישוב בנקודה X:</span>
                <div class="formula-line" id="mathCalc" style="color:#ef4444;">f'(...) = ...</div>
            </div>
        </div>

        <div id="tooltip"></div>
    </main>
</div>

<script src="questions.js"></script>

<script>
/**
 * ============================================================
 * SECTION 1: CONFIG & STATE (הגדרות ומשתנים)
 * ============================================================
 */
const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');
let width, height, scale = 40, originX, originY;

// משתני הפונקציה
let a=0, b=0, c=0, d=0, xVal=0;

// מצב משחק
let currQIndex = 0;
let isSolved = false;

// בדיקה שהשאלות נטענו
if (typeof QUESTIONS === 'undefined') {
    alert("שגיאה: קובץ השאלות (questions.js) לא נמצא או לא נטען!");
}

/**
 * ============================================================
 * SECTION 2: INITIALIZATION (אתחול המערכת)
 * ============================================================
 */
window.onload = function() {
    initResize();    // 1. סידור גודל מסך
    initUI();        // 2. בניית הרשימה
    gameLoadQuestion(0); // 3. טעינת שאלה ראשונה
    animate();       // 4. התחלת ציור
};

function initResize() {
    const container = document.getElementById('graphContainer');
    const resize = () => {
        width = cvs.width = container.clientWidth;
        height = cvs.height = container.clientHeight;
        originX = width / 2;
        originY = height / 2;
        sysUpdate(); // עדכון מיידי אחרי שינוי גודל
    };
    window.addEventListener('resize', resize);
    resize(); // הרצה ראשונית
}

function initUI() {
    const sel = document.getElementById('qSelect');
    QUESTIONS.forEach((q, i) => {
        let opt = document.createElement('option');
        opt.value = i;
        opt.innerText = q.title;
        sel.appendChild(opt);
    });
}

/**
 * ============================================================
 * SECTION 3: GAME LOGIC (לוגיקה וניהול שאלות)
 * ============================================================
 */
function gameLoadQuestion(idx) {
    currQIndex = parseInt(idx);
    const q = QUESTIONS[currQIndex];
    isSolved = false;
    
    // עדכון UI
    document.getElementById('qSelect').value = currQIndex;
    document.getElementById('qIndexBadge').innerText = `${currQIndex + 1} / ${QUESTIONS.length}`;
    document.getElementById('qDesc').innerText = q.desc;
    document.getElementById('toast').classList.remove('show');

    // איפוס פרמטרים לפי השאלה
    [a, b, c, d] = q.params;
    document.getElementById('inpA').value = a;
    document.getElementById('inpB').value = b;
    document.getElementById('inpC').value = c;
    document.getElementById('inpD').value = d;
    
    // איפוס X
    xVal = 0;
    document.getElementById('inpX').value = 0;

    // ניהול נעילות (Enable/Disable)
    const allInputs = ['inpA', 'inpB', 'inpC', 'inpD', 'inpX'];
    allInputs.forEach(id => document.getElementById(id).disabled = false);
    
    if (q.locked) {
        q.locked.forEach(id => document.getElementById(id).disabled = true);
    }

    sysUpdate();
}

function gameNext() {
    if (currQIndex < QUESTIONS.length - 1) {
        gameLoadQuestion(currQIndex + 1);
    }
}

// פונקציה ראשית שנקראת בכל שינוי סליידר
function sysUpdate() {
    // קריאת ערכים
    a = parseFloat(document.getElementById('inpA').value);
    b = parseFloat(document.getElementById('inpB').value);
    c = parseFloat(document.getElementById('inpC').value);
    d = parseFloat(document.getElementById('inpD').value);
    xVal = parseFloat(document.getElementById('inpX').value);

    // עדכון טקסטים
    document.getElementById('valA').innerText = a;
    document.getElementById('valB').innerText = b;
    document.getElementById('valC').innerText = c;
    document.getElementById('valD').innerText = d;
    document.getElementById('valX').innerText = xVal.toFixed(1);

    // חישוב נגזרת
    let slope = 3*a*xVal*xVal + 2*b*xVal + c;
    document.getElementById('valSlope').innerText = slope.toFixed(2);
    if(Math.abs(slope) < 0.1) document.getElementById('valSlope').style.color = '#16a34a'; // ירוק אם קרוב ל-0
    else document.getElementById('valSlope').style.color = 'black';

    updateEquationsText(slope);
    checkWinCondition(slope);
}

function updateEquationsText(slope) {
    // פורמט יפה לפונקציה
    let txt = "f(x) = ";
    let terms = [];
    if (a !== 0) terms.push(`${a}x³`);
    if (b !== 0) terms.push(`${b}x²`);
    if (c !== 0) terms.push(`${c}x`);
    if (d !== 0) terms.push(`${d}`);
    
    if (terms.length === 0) txt += "0";
    else txt += terms.join(" + ").replace(/\+ -/g, "- "); // תיקון פלוס מינוס
    
    document.getElementById('mathFunc').innerText = txt;
    document.getElementById('mathCalc').innerText = `f'(${xVal}) = ${slope.toFixed(2)}`;
}

function checkWinCondition(slope) {
    if (isSolved) return;
    const q = QUESTIONS[currQIndex];
    if (q.goal === 'free') return;

    let solved = false;
    
    // בדיקת חקירה (שיפוע 0)
    if (q.goal === 'slope_zero') {
        let dist = Math.abs(slope);
        if (q.targetX !== undefined) dist += Math.abs(xVal - q.targetX);
        if (dist < 0.15) solved = true;
    }
    
    // בדיקת מטרות (בנייה)
    if (q.goal === 'hit_target') {
        let totalErr = 0;
        q.targets.forEach(t => {
            let y = a*t.x**3 + b*t.x**2 + c*t.x + d;
            totalErr += Math.abs(y - t.y);
        });
        if (totalErr < 0.15) solved = true;
    }

    if (solved) {
        isSolved = true;
        document.getElementById('toast').classList.add('show');
        setTimeout(() => document.getElementById('toast').classList.remove('show'), 3000);
    }
}

/**
 * ============================================================
 * SECTION 4: DRAWING (ציור הגרף)
 * ============================================================
 */
function animate() {
    draw();
    requestAnimationFrame(animate);
}

function draw() {
    ctx.clearRect(0, 0, width, height);
    
    // רשת צירים
    drawGrid();

    // מטרות (אם יש)
    const q = QUESTIONS[currQIndex];
    if (q.targets) {
        q.targets.forEach(t => {
            drawPoint(t.x, t.y, '#16a34a', true); // נקודה ירוקה עם הילה
        });
    }

    // ציור הפונקציה
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#2563eb';
    ctx.beginPath();
    for (let px = 0; px < width; px+=2) {
        let x = (px - originX) / scale;
        let y = a*x**3 + b*x**2 + c*x + d;
        let py = originY - y * scale;
        if (px===0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
    }
    ctx.stroke();

    // ציור משיק ונקודה נוכחית
    let y0 = a*xVal**3 + b*xVal**2 + c*xVal + d;
    let m = 3*a*xVal**2 + 2*b*xVal + c;
    
    // משיק (כתום)
    let tanLen = 2.5;
    let x1 = xVal - tanLen;
    let y1 = m*(x1-xVal) + y0;
    let x2 = xVal + tanLen;
    let y2 = m*(x2-xVal) + y0;
    
    ctx.beginPath();
    ctx.strokeStyle = '#f97316';
    ctx.lineWidth = 2;
    ctx.moveTo(originX + x1*scale, originY - y1*scale);
    ctx.lineTo(originX + x2*scale, originY - y2*scale);
    ctx.stroke();

    // נקודה כחולה
    drawPoint(xVal, y0, '#2563eb', false);
}

function drawGrid() {
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1;
    ctx.beginPath();
    // אנכיים
    for (let x = originX % scale; x < width; x += scale) {
        ctx.moveTo(x, 0); ctx.lineTo(x, height);
    }
    // אופקיים
    for (let y = originY % scale; y < height; y += scale) {
        ctx.moveTo(0, y); ctx.lineTo(width, y);
    }
    ctx.stroke();

    // צירים ראשיים
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, originY); ctx.lineTo(width, originY);
    ctx.moveTo(originX, 0); ctx.lineTo(originX, height);
    ctx.stroke();
    
    // מספרים
    ctx.fillStyle = '#64748b';
    ctx.font = '10px sans-serif';
    ctx.fillText('0', originX + 2, originY + 12);
}

function drawPoint(x, y, color, glow) {
    let px = originX + x * scale;
    let py = originY - y * scale;
    
    if (glow) {
        ctx.fillStyle = color + '40'; // שקיפות
        ctx.beginPath(); ctx.arc(px, py, 12, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI*2); ctx.fill();
}
</script>
</body>
</html>
