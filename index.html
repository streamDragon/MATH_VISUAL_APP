<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מעבדת הפונקציות - המלא והשלם</title>

    <script type="text/javascript" charset="UTF-8" src="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraph.css" />
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="mobile.css">
    <script src="questions.js"></script>
    <script src="sound.js"></script>
</head>
<body>

    <button id="sound-toggle" onclick="toggleSound()">🔊</button>

    <div id="win-overlay">
        <h1>🏆 כל הכבוד!</h1>
        <p>פיצחת את המשימה.</p>
    </div>

    <div id="graph-area"></div>

    <div id="sidebar">
        <div style="text-align:center;">
            <h2 id="q-title">טוען...</h2>
            <div id="q-desc" style="font-size:0.9rem; color:#555;"></div>
        </div>

        <div class="info-box yellow-box">
            <div class="info-title">📜 דף נוסחאות</div>
            <div class="math-line" id="formula-f">f(x) = ...</div>
            <div class="math-line" id="formula-tag" style="color:#d32f2f;">f'(x) = ...</div>
        </div>

        <div class="info-box purple-box">
            <div class="info-title">📐 מעבדת האנך</div>
            <label>
                <input type="checkbox" id="chk-normal" onchange="toggleNormal()">
                הצג אנך ומשולש
            </label>
        </div>

        <div class="section-title">בניית הפונקציה</div>
        <div style="background:#fff; padding:8px; border-radius:5px; border:1px solid #eee;">
            <div class="slider-row"><span class="slider-lbl">a</span><input type="range" id="inpA" min="-5" max="5" step="0.1" class="slider-inp"></div>
            <div class="slider-row"><span class="slider-lbl">b</span><input type="range" id="inpB" min="-5" max="5" step="0.1" class="slider-inp"></div>
            <div class="slider-row"><span class="slider-lbl">c</span><input type="range" id="inpC" min="-5" max="5" step="0.1" class="slider-inp"></div>
            <div class="slider-row"><span class="slider-lbl">d</span><input type="range" id="inpD" min="-5" max="5" step="0.1" class="slider-inp"></div>
        </div>

        <div style="margin-top:auto;">
             <div class="section-title" style="margin-bottom:5px;">שלבים:</div>
             <div class="nav-grid" id="nav-container"></div>
        </div>
    </div>

    <script>
        let board, p, curve, tangent, normalLine, triangle, labelText;
        let targets = [];
        let params = { a:0, b:0, c:0, d:0 };
        let currentQ = 0;
        let wasWin = false;

        function init() {
            board = JXG.JSXGraph.initBoard('graph-area', {
                boundingbox: [-5, 8, 5, -8], axis: true, showCopyright: false,
                pan: {enabled:false}, zoom: {enabled:true}
            });

            curve = board.create('functiongraph', [
                x => params.a*x**3 + params.b*x**2 + params.c*x + params.d
            ], { strokeWidth: 4, strokeColor: '#1976d2' });

            p = board.create('glider', [0, 0, curve], {
                name: '', size: 10, color: '#1976d2', face:'o'
            });

            tangent = board.create('tangent', [p], { strokeColor:'#ff9800', strokeWidth:2, dash:2 });

            normalLine = board.create('line', [p, function() {
                let m = getSlope(p.X());
                if (Math.abs(m) < 0.001) return [p.X(), p.Y() + 1];
                return [p.X() + 1, p.Y() + (-1/m)];
            }], { strokeColor: '#8e24aa', strokeWidth: 2, visible: false, dash:3 });

            triangle = board.create('polygon', [[0,0], [0,0], [0,0]], {
                fillColor: '#8e24aa', fillOpacity: 0.2, visible: false, borders: {visible:false}
            });

            labelText = board.create('text', [
                () => p.X() + 0.5,
                () => p.Y() + 0.5,
                function() {
                    let m = getSlope(p.X());
                    return `X: ${p.X().toFixed(2)}<br>Y: ${p.Y().toFixed(2)}<br>m: ${m.toFixed(2)}`;
                }
            ], { anchor: p, fontSize: 13, cssClass: 'jxgbox', strokeColor:'black' });

            p.on('drag', updateInfo);
            board.on('up', updateInfo);

            ['inpA','inpB','inpC','inpD'].forEach(id => {
                document.getElementById(id).addEventListener('input', () => {
                    updateParams();
                    board.update();
                });
            });

            let nav = document.getElementById('nav-container');
            QUESTIONS.forEach((q, i) => {
                let btn = document.createElement('button');
                btn.className = 'q-btn'; btn.innerText = i+1;
                btn.onclick = () => loadQ(i);
                nav.appendChild(btn);
            });

            loadQ(0);
            updateSoundButton();
        }

        function getSlope(x) {
            return 3*params.a*x*x + 2*params.b*x + params.c;
        }

        function updateParams() {
            params.a = parseFloat(document.getElementById('inpA').value);
            params.b = parseFloat(document.getElementById('inpB').value);
            params.c = parseFloat(document.getElementById('inpC').value);
            params.d = parseFloat(document.getElementById('inpD').value);
            updateInfo();
        }

        function formatPoly(coeffs) {
            let parts = [];
            coeffs.forEach((term) => {
                let val = term.val;
                let pow = term.pow;
                if (Math.abs(val) < 0.001) return;

                let sign = (val < 0) ? ' - ' : (parts.length > 0 ? ' + ' : '');
                let absVal = Math.abs(val);
                let numStr = absVal.toFixed(1).replace('.0','');
                if (numStr === '1' && pow > 0) numStr = '';

                let xPart = pow === 3 ? 'x³' : pow === 2 ? 'x²' : pow === 1 ? 'x' : '';
                parts.push(sign + numStr + xPart);
            });
            if (parts.length === 0) return '0';
            let str = parts.join('');
            if (str.startsWith(' + ')) str = str.substring(3);
            if (str.startsWith(' - ')) str = '-' + str.substring(3);
            return str;
        }

        function updateInfo() {
            let x = p.X();
            let y = p.Y();
            let m = getSlope(x);

            let fTerms = [{val: params.a, pow:3}, {val: params.b, pow:2}, {val: params.c, pow:1}, {val: params.d, pow:0}];
            document.getElementById('formula-f').innerText = 'f(x) = ' + formatPoly(fTerms);

            let dTerms = [{val: 3*params.a, pow:2}, {val: 2*params.b, pow:1}, {val: params.c, pow:0}];
            document.getElementById('formula-tag').innerText = "f'(x) = " + formatPoly(dTerms);

            if(document.getElementById('chk-normal').checked) {
                triangle.dataX = [x, x+1, x+1];
                let normalSlope = (Math.abs(m) > 0.001) ? -1/m : 0;
                triangle.dataY = [y, y, y + normalSlope];
            }

            checkWin(m, x, y);
        }

        function toggleNormal() {
            let show = document.getElementById('chk-normal').checked;
            normalLine.setAttribute({visible: show});
            triangle.setAttribute({visible: show});
            board.update();
            updateInfo();
        }

        function loadQ(idx) {
            currentQ = idx;
            let q = QUESTIONS[idx];
            document.getElementById('q-title').innerText = q.title;
            document.getElementById('q-desc').innerText = q.desc;
            document.getElementById('win-overlay').style.display = 'none';
            wasWin = false;

            document.querySelectorAll('.q-btn').forEach((b,i) => b.classList.toggle('active', i===idx));

            params.a = q.params[0]; document.getElementById('inpA').value = params.a;
            params.b = q.params[1]; document.getElementById('inpB').value = params.b;
            params.c = q.params[2]; document.getElementById('inpC').value = params.c;
            params.d = q.params[3]; document.getElementById('inpD').value = params.d;

            ['inpA','inpB','inpC','inpD'].forEach(id => document.getElementById(id).disabled = false);
            if(q.locked) q.locked.forEach(id => document.getElementById(id).disabled = true);

            board.removeObject(targets);
            targets = [];
            if(q.targets) {
                q.targets.forEach(t => {
                    let pt = board.create('point', [t.x, t.y], {
                        name:'', fixed:true, color:'#00e676', size:5, face:'o'
                    });
                    targets.push(pt);
                });
            }

            p.setCoords(0, params.d);
            board.update();
            updateInfo();
        }

        function checkWin(m, x, y) {
            if (!QUESTIONS[currentQ]) return;
            let q = QUESTIONS[currentQ];
            let win = false;

            if (q.goal === 'slope_zero' && Math.abs(m) < 0.1) win = true;
            else if (q.goal === 'slope_equals' && Math.abs(m - q.targetM) < 0.1) win = true;
            else if (q.goal === 'hit_target' && q.targets) {
                let hitAll = true;
                q.targets.forEach(t => {
                    let dist = Math.sqrt((x - t.x)**2 + (y - t.y)**2);
                    if (dist > 0.5) hitAll = false;
                });
                if(hitAll) win = true;
            }

            let box = document.querySelector('.jxgbox');
            if (win) {
                document.getElementById('win-overlay').style.display = 'block';
                if(box) box.classList.add('winning-box');
                if (!wasWin) playSound('win');
            } else {
                document.getElementById('win-overlay').style.display = 'none';
                if(box) box.classList.remove('winning-box');
            }
            wasWin = win;
        }

        window.onload = init;
    </script>
</body>
</html>
