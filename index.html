<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מעבדת הפונקציות</title>
    
    <script type="text/javascript" charset="UTF-8" src="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraph.css" />
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <link rel="stylesheet" href="mobile.css">
</head>
<body>

    <button id="sound-toggle" onclick="toggleSound()">🔊</button>

    <div id="graph-area"></div>

    <div id="hud-container">
        <div id="holy-trinity">
            <div class="trinity-item"><span id="val-x" class="trinity-val">0</span><span class="trinity-label">X</span></div>
            <div class="trinity-item"><span id="val-y" class="trinity-val">0</span><span class="trinity-label">Y</span></div>
            <div class="trinity-item"><span id="val-m" class="trinity-val">0</span><span class="trinity-label">שיפוע</span></div>
        </div>
        <div id="win-overlay" style="display:none; position:absolute; top:80px; background:white; padding:20px; border:2px solid green; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,0.3);">
            <h2 style="margin:0; color:green;">🏆 כל הכבוד!</h2>
        </div>
    </div>

    <div id="sidebar">
        
        <div style="text-align:center;">
            <h2 id="q-title" style="margin:0 0 5px 0; color:#333;">טוען...</h2>
            <div id="q-desc" style="font-size:0.95rem; color:#555; line-height:1.4;"></div>
        </div>

        <div class="task-selector">
            <span class="task-label">בחר שלב במשחק:</span>
            <div class="nav-buttons" id="nav-container">
                </div>
        </div>

        <div class="info-box yellow-box">
            <div class="box-title">📝 דף נוסחאות</div>
            <div class="formula-display" id="formula-func">f(x) = ...</div>
            <div class="formula-display" id="formula-deriv" style="color:#d32f2f;">f'(x) = ...</div>
        </div>

        <div class="info-box purple-box">
            <div class="box-title">📐 מעבדת האנך</div>
            <label>
                <input type="checkbox" id="chk-normal" onchange="toggleNormal()">
                הצג אנך + משולש
            </label>
        </div>

        <div class="slider-container">
            <div class="slider-row"><span class="slider-lbl">a</span><input type="range" id="inpA" min="-2" max="2" step="0.1" class="slider-inp"></div>
            <div class="slider-row"><span class="slider-lbl">b</span><input type="range" id="inpB" min="-3" max="3" step="0.1" class="slider-inp"></div>
            <div class="slider-row"><span class="slider-lbl">c</span><input type="range" id="inpC" min="-5" max="5" step="0.1" class="slider-inp"></div>
            <div class="slider-row"><span class="slider-lbl">d</span><input type="range" id="inpD" min="-5" max="5" step="0.1" class="slider-inp"></div>
        </div>

    </div>

    <script src="sounds.js"></script>
    <script src="questions.js"></script>

    <script>
        let board, p, tangent, curve;
        let normalLine, trianglePoly; // משתנים לאנך ולמשולש
        let targets = [];
        let params = { a:0, b:0, c:0, d:0 };
        let currentQ = 0;
        let soundEnabled = true;

        function init() {
            if (typeof QUESTIONS === 'undefined') {
                alert("שגיאה: הקובץ questions.js לא נמצא.");
                return;
            }

            board = JXG.JSXGraph.initBoard('graph-area', {
                boundingbox: [-5, 8, 5, -8], axis: true, showCopyright: false,
                pan: { enabled: false }, zoom: { enabled: true }
            });

            // הפונקציה
            curve = board.create('functiongraph', [
                function(x) { return params.a*Math.pow(x,3) + params.b*Math.pow(x,2) + params.c*x + params.d; }
            ], { strokeWidth: 3, strokeColor: '#007bff' });

            // נקודה גוררת
            p = board.create('glider', [0, 0, curve], { name: '', size: 9, color: '#007bff' });
            
            // המשיק
            tangent = board.create('tangent', [p], { strokeColor: '#ff9f43', strokeWidth: 2, dash:2 });

            // --- מעבדת האנך (חדש!) ---
            // 1. האנך: קו שעובר ב-P עם שיפוע הופכי ונגדי
            normalLine = board.create('line', [p, function() {
                let m = 3*params.a*p.X()*p.X() + 2*params.b*p.X() + params.c;
                let normalM = -1/m;
                // יוצרים נקודה שניה כדי להגדיר קו: (x+1, y+m')
                return [p.X()+1, p.Y()+normalM];
            }], { strokeColor: '#ab47bc', strokeWidth: 2, visible: false });

            // 2. משולש (אופציונלי - בין המשיק לאנך לציר X למשל, או פשוט האנך)
            // לצורך פשטות: נצייר משולש בין הנקודה, החיתוך של האנך עם ציר X, וההיטל על הציר
            trianglePoly = board.create('polygon', [[0,0],[0,0],[0,0]], { 
                fillColor: '#ab47bc', fillOpacity: 0.2, borders: {visible:false}, visible:false 
            });

            // אירועים
            p.on('drag', updateAll);
            board.on('up', updateAll);
            
            ['inpA','inpB','inpC','inpD'].forEach(id => {
                document.getElementById(id).addEventListener('input', updateParams);
            });

            // יצירת כפתורי ניווט
            const nav = document.getElementById('nav-container');
            QUESTIONS.forEach((q, i) => {
                let btn = document.createElement('button');
                btn.className = 'q-btn'; 
                btn.innerText = i + 1;
                btn.onclick = () => loadQuestion(i);
                nav.appendChild(btn);
            });

            loadQuestion(0);
        }

        // פונקציה לבניית טקסט יפה (בלי מקדמים 0 וכו')
        function buildFuncText(a, b, c, d) {
            let terms = [];
            if (a !== 0) terms.push((a==1?'':a==-1?'-':a) + "x³");
            if (b !== 0) terms.push((b>0 && terms.length?'+':'') + (b==1 && terms.length?'':b==-1?'-':b) + "x²");
            if (c !== 0) terms.push((c>0 && terms.length?'+':'') + (c==1 && terms.length?'':c==-1?'-':c) + "x");
            if (d !== 0 || terms.length === 0) terms.push((d>0 && terms.length?'+':'') + d);
            return "f(x) = " + terms.join("");
        }

        function updateParams() {
            params.a = parseFloat(document.getElementById('inpA').value);
            params.b = parseFloat(document.getElementById('inpB').value);
            params.c = parseFloat(document.getElementById('inpC').value);
            params.d = parseFloat(document.getElementById('inpD').value);
            board.update();
            updateAll();
        }

        function toggleNormal() {
            let show = document.getElementById('chk-normal').checked;
            normalLine.setAttribute({visible: show});
            trianglePoly.setAttribute({visible: show});
            updateAll(); // כדי לעדכן מיקום מיידי
        }

        function updateAll() {
            let x = p.X();
            let y = params.a*Math.pow(x,3) + params.b*Math.pow(x,2) + params.c*x + params.d;
            let m = 3*params.a*x*x + 2*params.b*x + params.c;

            // עדכון HUD
            document.getElementById('val-x').innerText = x.toFixed(2);
            document.getElementById('val-y').innerText = y.toFixed(2);
            document.getElementById('val-m').innerText = m.toFixed(2);

            // עדכון תיבת הנוסחאות בצהוב
            document.getElementById('formula-func').innerText = buildFuncText(params.a, params.b, params.c, params.d);
            // נגזרת פשוטה לתצוגה
            let da = (3*params.a).toFixed(2).replace('.00','');
            let db = (2*params.b).toFixed(2).replace('.00','');
            let dc = params.c.toFixed(2).replace('.00','');
            document.getElementById('formula-deriv').innerText = `f'(x) = ${da}x² + ${db}x + ${dc}`;

            // לוגיקה למעבדת האנך (אם דלוקה)
            if (document.getElementById('chk-normal').checked) {
                // חישוב חיתוך האנך עם ציר X
                // משוואת האנך: Y - y1 = (-1/m)(X - x1)  =>  ב-Y=0:  -y1 = (-1/m)(X - x1) => X = x1 + y1*m
                if (Math.abs(m) > 0.01) {
                    let normalXIntercept = x + y*m; 
                    trianglePoly.dataX = [x, x, normalXIntercept];
                    trianglePoly.dataY = [0, y, 0];
                } else {
                    // מקרה קצה שיפוע 0 - אנך מאונך (אינסוף)
                    trianglePoly.dataX = [x, x, x];
                    trianglePoly.dataY = [0, y, 0];
                }
            }

            checkWin(m, x, y);
        }

        function loadQuestion(idx) {
            currentQ = idx;
            let q = QUESTIONS[idx];
            
            // סימון כפתור פעיל
            document.querySelectorAll('.q-btn').forEach((b, i) => {
                b.classList.toggle('active', i === idx);
            });

            document.getElementById('q-title').innerText = q.title;
            document.getElementById('q-desc').innerText = q.desc;
            document.getElementById('win-overlay').style.display = 'none';
            document.getElementById('holy-trinity').className = ''; 

            // איפוס סליידרים
            params.a = q.params[0]; params.b = q.params[1]; 
            params.c = q.params[2]; params.d = q.params[3];
            document.getElementById('inpA').value = params.a;
            document.getElementById('inpB').value = params.b;
            document.getElementById('inpC').value = params.c;
            document.getElementById('inpD').value = params.d;
            
            // נעילה לפי הצורך
            ['inpA','inpB','inpC','inpD'].forEach(id => document.getElementById(id).disabled = false);
            if(q.locked) q.locked.forEach(id => document.getElementById(id).disabled = true);

            // מטרות
            board.removeObject(targets);
            targets = [];
            if(q.targets) {
                q.targets.forEach(t => {
                    let pt = board.create('point', [t.x, t.y], { 
                        name:'', fixed:true, color:'#00e676', size:5, face:'o'
                    });
                    targets.push(pt);
                });
            }

            p.setCoords(0, params.d);
            updateParams();
        }

        function checkWin(m, x, y) {
            let q = QUESTIONS[currentQ];
            let win = false;

            if (q.goal === 'slope_zero' && Math.abs(m) < 0.1) win = true;
            if (q.goal === 'slope_equals' && Math.abs(m - q.targetM) < 0.1) win = true;
            if (q.goal === 'hit_target') {
                let hitAll = true;
                q.targets.forEach(t => {
                     // בודקים אם הפונקציה עוברת קרוב לנקודה
                    let yCalc = params.a*Math.pow(t.x,3) + params.b*Math.pow(t.x,2) + params.c*t.x + params.d;
                    if (Math.abs(yCalc - t.y) > 0.3) hitAll = false;
                });
                if(hitAll) win = true;
            }

            const hud = document.getElementById('holy-trinity');
            if (win) {
                hud.classList.add('winning');
                document.getElementById('win-overlay').style.display = 'block';
                if(soundEnabled) { /* אפשר להוסיף סאונד כאן אם רוצים */ }
            } else {
                hud.classList.remove('winning');
                document.getElementById('win-overlay').style.display = 'none';
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-toggle').innerText = soundEnabled ? "🔊" : "🔇";
        }

        window.onload = init;
    </script>
</body>
</html>
