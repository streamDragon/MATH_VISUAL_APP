<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעבדה לחקירת פונקציות - הכנה לבגרות</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="main-content">
        <div class="question-box">
            <h2 id="questionTitle">טוען שאלה...</h2>
            <div id="questionText" class="instructions">אנא המתן...</div>
            <div id="successMessage"></div>
        </div>
        
        <div id="canvasContainer">
            <canvas id="graphCanvas"></canvas>
        </div>
    </div>

    <div class="sidebar">
        
        <div class="panel">
            <h3>פרמטרים</h3>
            <div class="control-group">
                <label>a = <span id="valA">1</span></label>
                <input type="range" id="paramA" min="-5" max="5" step="0.1" value="1">
            </div>
            <div class="control-group">
                <label>b = <span id="valB">0</span></label>
                <input type="range" id="paramB" min="-5" max="5" step="0.1" value="0">
            </div>
            <div class="control-group">
                <label>c = <span id="valC">0</span></label>
                <input type="range" id="paramC" min="-5" max="5" step="0.1" value="0">
            </div>
            <div class="control-group">
                <label>d = <span id="valD">0</span></label>
                <input type="range" id="paramD" min="-5" max="5" step="0.1" value="0">
            </div>
        </div>

        <div class="panel x-control">
            <h3>חקירה (הזזת הנקודה)</h3>
            <div class="control-group">
                <label>x = <span id="valX">0</span></label>
                <input type="range" id="paramX" min="-10" max="10" step="0.1" value="0">
            </div>
        </div>

        <div class="panel">
            <h3>📝 יומן מתמטי</h3>
            <ul id="journalList">
            </ul>
        </div>
    </div>
</div>

<script src="bagrut_questions.js"></script>
<script src="script.js"></script>

</body>
</html>
