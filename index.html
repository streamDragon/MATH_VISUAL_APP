<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מעבדת חקירה</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    
    <header>
        <select id="qSelect" onchange="loadQuestionFromSelect()"></select>
        <button class="btn-nav" onclick="nextQuestion()">הבא &larr;</button>
    </header>

    <main id="mainArea">
        <div class="overlay-info">
            <div class="eq-text" id="eqn">y = ...</div>
            <div class="instr-text">
                <span id="qIcon">🎯</span> <span id="qText">טוען...</span>
            </div>
        </div>

        <div id="successBanner" class="success-badge">✨ הצלחה! ✨</div>

        <canvas id="cvs"></canvas>

        <div class="hud">
            <div>x: <b id="hX">0</b></div>
            <div>y: <b id="hY">0</b></div>
            <div>m: <b id="hM">0</b></div>
        </div>

        <div class="zoom-bar">
            <button onclick="changeZoom(1.1)">+</button>
            <button onclick="changeZoom(0.9)">-</button>
            <button onclick="resetView()">⟲</button>
        </div>
    </main>

    <footer>
        <div class="slider-row">
            <span class="lbl">X</span>
            <input type="range" id="mainX" min="-10" max="10" step="0.01" oninput="updateFromSlider()">
        </div>
        
        <details>
            <summary>⚙️ עריכה ידנית (a,b,c)</summary>
            <div class="manual-edit">
                <input type="number" id="mA" placeholder="x³" oninput="manual()">
                <input type="number" id="mB" placeholder="x²" oninput="manual()">
                <input type="number" id="mC" placeholder="x" oninput="manual()">
                <input type="number" id="mD" placeholder="#" oninput="manual()">
            </div>
        </details>
    </footer>

</div>

<script src="script.js"></script>
</body>
</html>
