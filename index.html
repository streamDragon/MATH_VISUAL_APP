<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מעבדת חקירה</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-layout">
    
    <header class="header-section">
        <div class="top-row">
            <select id="qSelect" onchange="loadQuestionFromSelect()"></select>
            <button class="btn-next" onclick="nextQuestion()">הבא &larr;</button>
        </div>

        <div class="instruction-box">
            <span id="qIcon">🎯</span>
            <span id="qText">טוען...</span>
        </div>
    </header>

    <main class="canvas-wrapper" id="cWrap">
        <div id="successBanner" class="success-badge">✨ הצלחה! ✨</div>

        <div class="equation-display" id="eqn">y = ...</div>
        
        <canvas id="cvs"></canvas>

        <div class="hud">
            <div>x: <b id="hX">0</b></div>
            <div>y: <b id="hY">0</b></div>
            <div>m: <b id="hM">0</b></div>
        </div>

        <div class="fab-controls">
            <button onclick="resetView()">⟲</button>
            <button onclick="changeZoom(1.1)">+</button>
            <button onclick="changeZoom(0.9)">-</button>
        </div>
    </main>

    <footer class="footer-section">
        <div class="slider-container">
            <input type="range" id="mainX" min="-10" max="10" step="0.01" oninput="updateFromSlider()">
        </div>
        
        <details>
            <summary>מקדמים (a, b, c)</summary>
            <div class="inputs-row">
                <input type="number" id="mA" placeholder="x³" oninput="manual()">
                <input type="number" id="mB" placeholder="x²" oninput="manual()">
                <input type="number" id="mC" placeholder="x" oninput="manual()">
                <input type="number" id="mD" placeholder="#" oninput="manual()">
            </div>
        </details>
    </footer>

</div>

<script src="script.js"></script>
</body>
</html>
