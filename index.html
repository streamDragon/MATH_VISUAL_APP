<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מעבדת הפונקציות</title>
    
    <script type="text/javascript" charset="UTF-8" src="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraph.css" />
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="mobile.css">
</head>
<body>

    <button id="sound-toggle" onclick="toggleSound()">🔊</button>
    
    <div id="win-overlay">
        <h1>🏆 כל הכבוד!</h1>
        <p>פיצחת את המשימה.</p>
    </div>

    <div id="graph-area"></div>

    <div id="sidebar">
        
        <div style="text-align:center; margin-bottom:10px;">
            <h2 id="q-title" style="margin:0; font-size:1.3rem;">טוען...</h2>
            <div id="q-desc" style="font-size:0.95rem; color:#555;"></div>
        </div>

        <div class="nav-grid" id="nav-container"></div>

        <div class="info-box yellow-box">
            <div class="info-title">📜 דף נוסחאות</div>
            <div class="math-line" id="formula-f">f(x) = ...</div>
            <div class="math-line" id="formula-tag" style="color:#d32f2f;">f'(x) = ...</div>
        </div>

        <div class="info-box purple-box">
            <div class="info-title">📐 מעבדת האנך</div>
            <label>
                <input type="checkbox" id="chk-normal" onchange="toggleNormal()">
                הצג אנך ומשולש
            </label>
        </div>

        <div class="section-title">בניית הפונקציה (פרמטרים)</div>
        <div style="background:#fff; padding:5px; border-radius:5px;">
            <div class="slider-row"><span class="slider-lbl">a</span><input type="range" id="inpA" min="-2" max="2" step="0.1" class="slider-inp"></div>
            <div class="slider-row"><span class="slider-lbl">b</span><input type="range" id="inpB" min="-3" max="3" step="0.1" class="slider-inp"></div>
            <div class="slider-row"><span class="slider-lbl">c</span><input type="range" id="inpC" min="-5" max="5" step="0.1" class="slider-inp"></div>
            <div class="slider-row"><span class="slider-lbl">d</span><input type="range" id="inpD" min="-5" max="5" step="0.1" class="slider-inp"></div>
        </div>

    </div>

    <script src="questions.js"></script>
    
    <script>
        let board, p, curve, tangent, normalLine, triangle;
        let targets = []; // מערך למטרות הירוקות
        let params = { a:0, b:0, c:0, d:0 };
        let labelText; // השלשה הקדושה (טקסט צף)
        let currentQ = 0;
        let soundEnabled = true;

        function init() {
            // בדיקה שקובץ השאלות נטען
            if (typeof QUESTIONS === 'undefined') {
                alert("שגיאה: הקובץ questions.js לא נמצא.");
                return;
            }

            // יצירת הגרף
            board = JXG.JSXGraph.initBoard('graph-area', {
                boundingbox: [-5, 8, 5, -8], axis: true, showCopyright: false,
                pan: {enabled:false}, zoom: {enabled:true}
            });

            // הפונקציה
            curve = board.create('functiongraph', [
                x => params.a*x**3 + params.b*x**2 + params.c*x + params.d
            ], { strokeWidth: 3, strokeColor: '#007bff' });

            // הנקודה הגוררת
            p = board.create('glider', [0, 0, curve], { 
                name: '', size: 9, color: '#007bff' 
            });

            // השלשה הקדושה - טקסט שזז עם הנקודה
            labelText = board.create('text', [
                () => p.X() + 0.5, // מיקום X
                () => p.Y() + 0.5, // מיקום Y
                function() {
                    let m = getSlope(p.X());
                    return `X: ${p.X().toFixed(2)}<br>Y: ${p.Y().toFixed(2)}<br>m: ${m.toFixed(2)}`;
                }
            ], { 
                anchor: p, fontSize: 14, cssClass: 'jxgbox', strokeColor:'black' 
            });

            // משיק
            tangent = board.create('tangent', [p], { strokeColor:'#ff9800', dash:2 });

            // אנך ומשולש (מוסתרים בהתחלה)
            normalLine = board.create('line', [p, function() {
                let m = getSlope(p.X());
                // אם השיפוע 0, יש בעיה בנוסחה הרגילה, אבל JSXGraph מטפל בזה לרוב.
                return [p.X() + 1, p.Y() + (-1/m)]; 
            }], { strokeColor: '#8e24aa', strokeWidth: 2, visible: false });

            triangle = board.create('polygon', [[0,0], [0,0], [0,0]], {
                fillColor: '#8e24aa', fillOpacity: 0.2, visible: false, borders: {visible:false}
            });

            // האזנה לשינויים
            p.on('drag', updateInfo);
            board.on('up', updateInfo); // עדכון כשעוזבים את העכבר

            ['inpA','inpB','inpC','inpD'].forEach(id => {
                document.getElementById(id).addEventListener('input', updateParams);
            });

            // בניית כפתורים למשימות
            let nav = document.getElementById('nav-container');
            QUESTIONS.forEach((q, i) => {
                let btn = document.createElement('button');
                btn.className = 'q-btn'; btn.innerText = i+1;
                btn.onclick = () => loadQ(i);
                nav.appendChild(btn);
            });
            
            // טעינת שאלה ראשונה
            loadQ(0);
        }

        function getSlope(x) {
            return 3*params.a*x*x + 2*params.b*x + params.c;
        }

        function updateParams() {
            params.a = parseFloat(document.getElementById('inpA').value);
            params.b = parseFloat(document.getElementById('inpB').value);
            params.c = parseFloat(document.getElementById('inpC').value);
            params.d = parseFloat(document.getElementById('inpD').value);
            board.update();
            updateInfo();
        }

        function updateInfo() {
            let x = p.X();
            let m = getSlope(x);
            let y = p.Y();

            // עדכון תיבת הנוסחאות
            let a = params.a, b = params.b, c = params.c, d = params.d;
            
            // בניית מחרוזת הפונקציה בצורה יפה
            let fStr = `${a!=0?a+'x³':''} ${b>0?'+':''}${b!=0?b+'x²':''} ${c>0?'+':''}${c!=0?c+'x':''} ${d>0?'+':''}${d!=0?d:''}`;
            if(fStr.trim() === '') fStr = "0";
            // ניקוי סימני פלוס מיותרים בהתחלה
            fStr = fStr.replace(/^\s*\+\s*/, '').replace(/\s\+/g, ' +').replace(/\s-/g, ' -');
            document.getElementById('formula-f').innerText = "f(x) = " + fStr;

            // בניית מחרוזת הנגזרת
            let da = (3*a).toFixed(2).replace('.00','');
            let db = (2*b).toFixed(2).replace('.00','');
            let dc = c.toFixed(2).replace('.00','');
            document.getElementById('formula-tag').innerText = `f'(x) = ${da}x² + ${db}x + ${dc}`;

            // עדכון משולש האנך
            if(document.getElementById('chk-normal').checked) {
                if (Math.abs(m) > 0.01) {
                    let xIntercept = x + y*m;
                    triangle.dataX = [x, x, xIntercept];
                    triangle.dataY = [0, y, 0];
                } else {
                    triangle.dataX = [x, x, x];
                    triangle.dataY = [0, y, 0];
                }
            }

            // --- לוגיקת בדיקת ניצחון (הוחזרה!) ---
            checkWin(m, x, y);
        }

        function toggleNormal() {
            let show = document.getElementById('chk-normal').checked;
            normalLine.setAttribute({visible: show});
            triangle.setAttribute({visible: show});
            board.update();
        }

        function loadQ(idx) {
            currentQ = idx;
            let q = QUESTIONS[idx];
            document.getElementById('q-title').innerText = q.title;
            document.getElementById('q-desc').innerText = q.desc;
            
            // איפוס מצב ניצחון
            document.getElementById('win-overlay').style.display = 'none';
            if (labelText) labelText.setAttribute({cssClass: 'jxgbox'}); // החזרת צבע רגיל

            // עדכון כפתורים
            document.querySelectorAll('.q-btn').forEach((b,i) => {
                b.classList.toggle('active', i===idx);
            });

            // איפוס פרמטרים
            params.a = q.params[0]; document.getElementById('inpA').value = params.a;
            params.b = q.params[1]; document.getElementById('inpB').value = params.b;
            params.c = q.params[2]; document.getElementById('inpC').value = params.c;
            params.d = q.params[3]; document.getElementById('inpD').value = params.d;
            
            // נעילת סליידרים אם צריך
            ['inpA','inpB','inpC','inpD'].forEach(id => document.getElementById(id).disabled = false);
            if(q.locked) q.locked.forEach(id => document.getElementById(id).disabled = true);

            // יצירת מטרות (Targets)
            board.removeObject(targets);
            targets = [];
            if(q.targets) {
                q.targets.forEach(t => {
                    let pt = board.create('point', [t.x, t.y], { 
                        name:'', fixed:true, color:'#00e676', size:6, face:'o', strokeWidth:2, strokeColor:'green'
                    });
                    targets.push(pt);
                });
            }

            p.setCoords(0, params.d);
            updateParams();
        }

        function checkWin(m, x, y) {
            if (!QUESTIONS || !QUESTIONS[currentQ]) return;
            
            let q = QUESTIONS[currentQ];
            let win = false;

            // בדיקת סוגי ניצחון
            if (q.goal === 'slope_zero' && Math.abs(m) < 0.1) win = true;
            else if (q.goal === 'slope_equals' && Math.abs(m - q.targetM) < 0.1) win = true;
            else if (q.goal === 'hit_target') {
                let hitAll = true;
                if (q.targets) {
                    q.targets.forEach(t => {
                        // חישוב ה-Y של הפונקציה בנקודת ה-X של המטרה
                        let yCalc = params.a*Math.pow(t.x,3) + params.b*Math.pow(t.x,2) + params.c*t.x + params.d;
                        // בדיקה אם הפונקציה עוברת קרוב למטרה
                        if (Math.abs(yCalc - t.y) > 0.4) hitAll = false;
                    });
                } else { hitAll = false; }
                if(hitAll) win = true;
            }

            // טיפול בניצחון
            if (win) {
                document.getElementById('win-overlay').style.display = 'block';
                // שינוי צבע הקופסה הצפה
                labelText.setAttribute({cssClass: 'jxgbox winning-box'});
            } else {
                document.getElementById('win-overlay').style.display = 'none';
                labelText.setAttribute({cssClass: 'jxgbox'});
            }
        }

        function toggleSound() { 
            soundEnabled = !soundEnabled;
            document.getElementById('sound-toggle').innerText = soundEnabled ? "🔊" : "🔇";
        }

        window.onload = init;
    </script>
</body>
</html>
