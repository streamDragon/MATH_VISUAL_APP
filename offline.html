<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>אין חיבור כרגע | מעבדת הפונקציות</title>
    <meta name="theme-color" content="#6C5CE7">
    <style>
        :root {
            color-scheme: light;
            --bg: #f6f7ff;
            --card: rgba(255, 255, 255, 0.96);
            --line: #d9def7;
            --text: #1f2937;
            --muted: #64748b;
            --accent: #6c5ce7;
            --accent-2: #a29bfe;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: "Assistant", "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top right, rgba(162, 155, 254, 0.22), transparent 30%),
                linear-gradient(180deg, #fbfbff 0%, var(--bg) 100%);
        }

        .card {
            width: min(100%, 420px);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 28px;
            padding: 28px 22px;
            box-shadow: 0 22px 48px rgba(15, 23, 42, 0.1);
            text-align: center;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 68px;
            height: 68px;
            margin-bottom: 14px;
            border-radius: 22px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #ffffff;
            font-size: 28px;
            box-shadow: 0 14px 30px rgba(108, 92, 231, 0.2);
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(1.5rem, 4vw, 2rem);
            line-height: 1.25;
        }

        p {
            margin: 0;
            color: var(--muted);
            line-height: 1.8;
            font-size: 1rem;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 22px;
            justify-content: center;
        }

        .actions a,
        .actions button {
            min-height: 46px;
            padding: 10px 16px;
            border-radius: 16px;
            border: 0;
            font: inherit;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
        }

        .actions .primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #ffffff;
        }

        .actions .secondary {
            background: #ffffff;
            color: var(--text);
            border: 1px solid var(--line);
        }

        .meta {
            margin-top: 18px;
            font-size: 0.9rem;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="badge" aria-hidden="true">∿</div>
        <h1>אין חיבור כרגע</h1>
        <p>
            לא הצלחנו לטעון את האפליקציה מהרשת כרגע.
            אם כבר פתחתם את האתר בעבר, חלק מהמסכים עדיין יישארו זמינים ברגע שהחיבור יחזור.
        </p>
        <div class="actions">
            <button class="primary" type="button" onclick="window.location.reload()">לנסות שוב</button>
            <a class="secondary" href="/">חזרה לדף הראשי</a>
        </div>
        <div class="meta">אפשר לחזור לכאן כשתהיה שוב רשת.</div>
    </main>
</body>
</html>
