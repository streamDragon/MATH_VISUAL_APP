name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare stamped site artifact
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ID="${GITHUB_SHA::12}"
          BUILD_TIME="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          rm -rf _site
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/

          sed -i "s/__BUILD_ID__/${BUILD_ID}/g" _site/index.html _site/version.json
          sed -i "s/__BUILD_TIME__/${BUILD_TIME}/g" _site/version.json

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
