name: Deploy GitHub Pages redirect

# GitHub Pages is no longer a full deployment target (it cannot serve the
# /api serverless functions, so cloud features silently failed there).
# The canonical deployment is Vercel: https://math-visual-app-pi.vercel.app
# This workflow keeps old GitHub Pages links working by publishing a single
# redirect page that also unregisters the stale service worker.

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate redirect page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          touch dist/.nojekyll
          cat > dist/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="he" dir="rtl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>מעבדת הפונקציות — עברנו כתובת</title>
            <meta http-equiv="refresh" content="2;url=https://math-visual-app-pi.vercel.app/">
            <link rel="canonical" href="https://math-visual-app-pi.vercel.app/">
            <style>
              body { font-family: 'Assistant', sans-serif; background: #1d1340; color: #fff;
                     display: grid; place-items: center; min-height: 100vh; margin: 0; text-align: center; }
              a { color: #a99bff; font-weight: 700; }
            </style>
          </head>
          <body>
            <main>
              <h1>האפליקציה עברה לכתובת חדשה</h1>
              <p>מעבירים אותך אוטומטית. אם לא עברת, לחצו:
                <a href="https://math-visual-app-pi.vercel.app/">math-visual-app-pi.vercel.app</a>
              </p>
            </main>
            <script>
              (async () => {
                try {
                  if ('serviceWorker' in navigator) {
                    const regs = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(regs.map((r) => r.unregister()));
                  }
                  if (window.caches && caches.keys) {
                    const keys = await caches.keys();
                    await Promise.all(keys.map((k) => caches.delete(k)));
                  }
                } catch (err) { /* best effort cleanup */ }
                location.replace('https://math-visual-app-pi.vercel.app/');
              })();
            </script>
          </body>
          </html>
          HTML
          cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
