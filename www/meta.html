<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Meta-Questions Generator</title>
  <link rel="stylesheet" href="meta.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>Meta-Questions</h1>
      <div class="lang-toggle">
        <button id="btn-he" class="active">עברית</button>
        <button id="btn-en">English</button>
      </div>
    </header>

    <main>
      <label for="model-desc">תיאור מהיר של המודל / Model description</label>
      <textarea id="model-desc" placeholder="לדוגמה: רשת נוירונים קטנה שאומנה לזיהוי טקסט" rows="3"></textarea>

      <label for="question-type">סוג השאלה / Question type</label>
      <select id="question-type">
        <option value="analysis">ניתוח / Analysis</option>
        <option value="validation">בדיקה / Validation</option>
        <option value="robustness">חוסן / Robustness</option>
        <option value="ethics">אתיקה / Ethics</option>
        <option value="explainability">הסבריות / Explainability</option>
      </select>

      <div class="actions">
        <button id="btn-generate">צור שאלות / Generate</button>
        <button id="btn-randomize">אקראי / Randomize</button>
      </div>

      <section id="results">
        <h2>שאלות / Questions</h2>
        <ul id="questions-list"></ul>
        <div class="controls">
          <button id="btn-copy">העתק / Copy</button>
          <button id="btn-download">הורד כטקסט / Download</button>
        </div>
      </section>
    </main>

    <footer>
      <small>דו-לשוני — עברית + English • קל לשיתוף</small>
    </footer>
  </div>

  <script src="meta.js"></script>
</body>
</html>
